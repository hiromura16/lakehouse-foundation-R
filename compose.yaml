# Foundation Rの標準構成。設定とデータはComposeプロジェクトごとに管理する。
name: lakehouse-r

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

# 変数は非公開設定から展開する。PostgreSQLのURLとS3のJSONへ安全に
# 埋め込める初期値をnative/setup.pyで生成する。
x-catalog: &catalog-env
  LAKEKEEPER__PG_ENCRYPTION_KEY: ${CATALOG_ENCRYPTION_KEY:?native/setup.pyで非公開設定を作成してください}
  LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://lakekeeper:${CATALOG_DB_PASSWORD:?native/setup.pyで非公開設定を作成してください}@catalog-db:5432/lakekeeper
  LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://lakekeeper:${CATALOG_DB_PASSWORD:?native/setup.pyで非公開設定を作成してください}@catalog-db:5432/lakekeeper
  LAKEKEEPER__BASE_URI: http://catalog:8181
  LAKEKEEPER__AUTHZ_BACKEND: allowall

x-configured-image: &configured-image
  context: .
  dockerfile: native/Dockerfile.configured

# 2つのNginx入口は、固定ルートだけをプロキシする。
x-private-proxy: &private-proxy
  restart: unless-stopped
  entrypoint: [nginx]
  command: [-g, daemon off;]
  user: "${LANDING_UID}:${LANDING_GID}"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:size=32m,mode=1777"]
  mem_limit: 64m
  logging: *logging
  labels:
    traefik.enable: 'false'

x-no-proxy: &no-proxy "localhost,127.0.0.1,::1,catalog,catalog-db,storage,lakehouse,prometheus,grafana,blackbox,${NO_PROXY:-${no_proxy:-}}"

services:
  catalog-db:
    networks:
      catalog_db: {}
    image: postgres:18.6-alpine@sha256:300ebd02c6d4de9ee27ad7f6855d5d21b4d3a4a5117767c1197d284c635d9736
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m
    environment:
      POSTGRES_DB: lakekeeper
      POSTGRES_USER: lakekeeper
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:?native/setup.pyで非公開設定を作成してください}
    volumes:
      # PostgreSQL 18の公式イメージはこの配下に版別のPGDATAを置く。
      - catalog-db:/var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, -U, lakekeeper, -d, lakekeeper]
      interval: 5s
      timeout: 3s
      retries: 24

  catalog-migrate:
    networks:
      catalog_db: {}
    image: quay.io/lakekeeper/catalog:v0.14.3@sha256:0009e7ccb26db811b8fc485974b624a999fd096f4da549a8704d3121dc20e98a
    command: [migrate]
    logging: *logging
    environment: *catalog-env
    depends_on:
      catalog-db:
        condition: service_healthy

  catalog:
    networks:
      catalog_db: {}
      writer: {}
      catalog_view: {}
    image: quay.io/lakekeeper/catalog:v0.14.3@sha256:0009e7ccb26db811b8fc485974b624a999fd096f4da549a8704d3121dc20e98a
    command: [serve]
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m
    environment: *catalog-env
    depends_on:
      catalog-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, /home/nonroot/lakekeeper, healthcheck]
      interval: 5s
      timeout: 3s
      retries: 30

  storage:
    networks:
      writer: {}
    image: chrislusf/seaweedfs:4.53@sha256:972ba30c529dfc72a6a12ed427e94d99c7b6a6e59d97bfa52be0a849f43e2cc9
    restart: unless-stopped
    logging: *logging
    mem_limit: 768m
    command:
      - server
      - -dir=/data
      - -ip=storage
      - -ip.bind=0.0.0.0
      - -volume.max=16
      - -master.volumeSizeLimitMB=1024
      - -filer
      - -s3
      - -s3.config=/etc/seaweedfs/s3.json
    configs:
      - source: storage-auth
        target: /etc/seaweedfs/s3.json
      - source: filer
        target: /etc/seaweedfs/filer.toml
    volumes:
      - storage:/data
    healthcheck:
      # 固定ポートでS3が応答し、未認証のバケット一覧を拒否することを確認する。
      test:
        - CMD-SHELL
        - wget -S -Y off -O /dev/null -T 3 http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/1.1 403 Forbidden'
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 20s

  lakehouse:
    networks:
      writer: {}
      api_origin:
        aliases: [lakehouse-origin]
    image: ${COMPOSE_PROJECT_NAME:-lakehouse-r}-lakehouse
    pull_policy: build
    build:
      context: .
      dockerfile: native/Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-${http_proxy:-}}
        HTTPS_PROXY: ${HTTPS_PROXY:-${https_proxy:-}}
        http_proxy: ${http_proxy:-${HTTP_PROXY:-}}
        https_proxy: ${https_proxy:-${HTTPS_PROXY:-}}
        NO_PROXY: *no-proxy
        no_proxy: *no-proxy
        CORPORATE_CA_SHA256: ${CORPORATE_CA_SHA256:-}
      secrets: [corporate-ca, python-index-config, python-index-auth]
    restart: unless-stopped
    logging: *logging
    mem_limit: 2g
    cpus: 2
    user: "${LANDING_UID:?native/setup.pyで非公開設定を作成してください}:${LANDING_GID:?native/setup.pyで非公開設定を作成してください}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=268435456,mode=1777"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?native/setup.pyで非公開設定を作成してください}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?native/setup.pyで非公開設定を作成してください}
      S3_BUCKET_RAW: lakehouse-r-raw
      S3_BUCKET_WAREHOUSE: lakehouse-r-warehouse
      WAREHOUSE_NAME: foundation-r
      # 2 CPUの上限に揃え、Parquet読み込みをホストのCPU総数へ広げない。
      PYICEBERG_MAX_WORKERS: '2'
      WORKER_TOKEN: ${WORKER_TOKEN:?native/setup.pyで非公開設定を作成してください}
      READER_TOKEN: ${READER_TOKEN:?native/setup.pyで非公開設定を作成してください}
      NO_PROXY: *no-proxy
      no_proxy: *no-proxy
    volumes:
      - type: bind
        source: ${LANDING_DIR:?native/setup.pyで非公開設定を作成してください}
        target: /landing
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${LAKEHOUSE_API_PORT:-18502}:8080"
    depends_on:
      catalog:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -m, native.api, health]
      interval: 5s
      timeout: 3s
      retries: 45

  blackbox:
    networks:
      catalog_db: {}
      writer: {}
      probes: {}
    image: ${COMPOSE_PROJECT_NAME:-lakehouse-r}-blackbox
    pull_policy: build
    build:
      <<: *configured-image
      target: blackbox
    command: [--config.file=/etc/blackbox/blackbox.yml]
    restart: unless-stopped
    logging: *logging
    mem_limit: 96m
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9115/-/healthy]
      interval: 5s
      timeout: 3s
      retries: 12

  prometheus:
    networks:
      probes: {}
      api_origin: {}
      metrics_view: {}
    image: ${COMPOSE_PROJECT_NAME:-lakehouse-r}-prometheus
    pull_policy: build
    build:
      <<: *configured-image
      target: prometheus
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - prometheus:/prometheus
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9090/-/ready]
      interval: 5s
      timeout: 3s
      retries: 12

  grafana:
    networks:
      metrics_view: {}
    image: ${COMPOSE_PROJECT_NAME:-lakehouse-r}-grafana
    pull_policy: build
    build:
      <<: *configured-image
      target: grafana
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?native/setup.pyで非公開設定を作成してください}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:18501/}
      GF_SECURITY_COOKIE_SECURE: ${GRAFANA_COOKIE_SECURE:-false}
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_PANELS_DISABLE_SANITIZE_HTML: 'false'
    volumes:
      - grafana:/var/lib/grafana
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3000/api/health]
      interval: 5s
      timeout: 3s
      retries: 24
    ports:
      - "127.0.0.1:${LAKEHOUSE_GRAFANA_PORT:-18501}:3000"

  read-api:
    <<: *private-proxy
    image: ${COMPOSE_PROJECT_NAME:-lakehouse-r}-read-api
    pull_policy: build
    build:
      <<: *configured-image
      target: read-api
    networks:
      api_origin: {}
      probes: {}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/_gateway-health]
      interval: 10s
      timeout: 3s
      retries: 10

  health-relay:
    <<: *private-proxy
    image: ${COMPOSE_PROJECT_NAME:-lakehouse-r}-health-relay
    pull_policy: build
    build:
      <<: *configured-image
      target: health-relay
    networks:
      probes: {}
      catalog_view: {}
      metrics_view: {}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8120/_relay-health]
      interval: 10s
      timeout: 3s
      retries: 10

networks:
  catalog_db:
    internal: true
  writer:
    internal: true
  catalog_view:
    internal: true
  probes:
    internal: true
  api_origin:
  metrics_view:

configs:
  storage-auth:
    content: |
      {"identities":[{"name":"lakehouse-r","credentials":[
        {"accessKey":"${S3_ACCESS_KEY}","secretKey":"${S3_SECRET_KEY}"}
      ],"actions":["Admin","Read","Write","List","Tagging"]}]}
  filer:
    content: |
      [leveldb2]
      enabled = true
      dir = "/data/filer"

secrets:
  corporate-ca:
    # 社内CA未指定時は空ファイルを使い、ローカルとDokployの手順をそろえる。
    file: ${CORPORATE_CA_FILE:-./infra/proxy/empty-ca.pem}
  python-index-config:
    file: ${CORPORATE_UV_CONFIG_FILE:-./infra/proxy/empty-ca.pem}
  python-index-auth:
    file: ${CORPORATE_PYPI_NETRC_FILE:-./infra/proxy/empty-ca.pem}

volumes:
  catalog-db:
  storage:
  prometheus:
  grafana:
