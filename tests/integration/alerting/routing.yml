# 実サービス由来の警告を除き、この合成アラートだけに配信する。
route:
  receiver: no-delivery
  group_by: [alertname, app, job]
  group_wait: 2s
  group_interval: 5s
  repeat_interval: 10m
  routes:
    - receiver: fixture
      matchers:
        - 'alertname="LakehouseApplicationDown"'
        - 'app="Synthetic Alert Probe"'
receivers:
  - name: no-delivery
  - name: fixture
    webhook_configs:
      - url: http://alert-fixture:8080/receive
        send_resolved: true
