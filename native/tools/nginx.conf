worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 128; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 ipv6=off valid=15s;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_protocol;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # ゲートウェイの認証情報は下流のアプリへ転送しない。
    proxy_set_header Authorization "";
    auth_basic "Foundation R Tools";
    auth_basic_user_file /run/secrets/tools-htpasswd;

    map $http_upgrade $connection_upgrade { default upgrade; "" close; }
    map $http_x_forwarded_proto $forwarded_protocol { https https; default $scheme; }
    # 利用者の入力からプロキシ先を組み立てず、疎通だけを固定ルートで確認する。
    map $uri $probe_target {
        default "";
        /status/lakehouse http://lakehouse:8080/health;
        /status/grafana http://grafana:3000/api/health;
        /status/prometheus http://prometheus:9090/-/ready;
        /status/catalog http://catalog:8181/health;
        /status/browser http://data-browser:8501/_stcore/health;
        /status/n8n http://n8n:5678/healthz/readiness;
        /status/openobserve http://openobserve:5080/healthz;
        /status/explorer http://influx-explorer:8080/;
        /status/influxdb http://influxdb3:8181/health;
    }

    server {
        listen 8060;
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'";
        location = /_health { auth_basic off; access_log off; return 204; }
        location = /ports.json { alias /etc/foundation-tools/ports.json; }
        location /status/ {
            if ($request_method != GET) { return 405; }
            if ($probe_target = "") { return 404; }
            proxy_connect_timeout 2s;
            proxy_read_timeout 4s;
            proxy_pass $probe_target;
        }
        location / { try_files $uri $uri/ =404; }
    }

    server {
        listen 8061;
        location / {
            set $upstream http://n8n:5678;
            proxy_buffering off;
            proxy_read_timeout 120s;
            proxy_pass $upstream;
        }
    }

    server {
        listen 8062;
        location / {
            set $upstream http://influx-explorer:8080;
            proxy_pass $upstream;
        }
    }
}
