# Kafkaの合成トピックを受け、他の業務テーブルと分離した時系列DBへ送る。
data_dir = "/var/lib/vector"

[sources.factory_sensor]
type = "kafka"
bootstrap_servers = "broker:9092"
topics = ["foundation-r-evaluation-sensors"]
group_id = "foundation-r-evaluation-greptime"
auto_offset_reset = "earliest"
decoding.codec = "influxdb"

[sinks.sensor_store]
type = "greptimedb_metrics"
inputs = ["factory_sensor"]
endpoint = "greptime:4001"
dbname = "public"
# 原本はKafka側に保持し、GreptimeDBへの書き込み成功後に消費位置を確定する。
# 保存先が止まっている間は小さい待ち行列で受信を絞り、未確定分はKafkaから再取得する。
acknowledgements.enabled = true
buffer.type = "memory"
buffer.max_events = 500
buffer.when_full = "block"
