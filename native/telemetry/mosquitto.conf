# 専用Dockerネットワーク内だけで使う合成検証ブローカー。
listener 1883
allow_anonymous false
password_file /run/secrets/mqtt-passwords
acl_file /etc/foundation/mqtt.acl
persistence true
persistence_location /mosquitto/data/
autosave_interval 10
# 受信点数と未接続クライアントのキューは、合成試験の容量に制限する。
max_packet_size 65536
max_queued_messages 1000
max_queued_bytes 8388608
