# 任意アプリの入口。認証は既存APIが判定し、ここでは公開経路とメソッドを限定する。
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 128; }

http {
    server_tokens off;
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 ipv6=off valid=15s;
    proxy_connect_timeout 2s;
    proxy_read_timeout 20s;
    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host $proxy_host;
    proxy_set_header Content-Length "";

    server {
        listen 8080;
        set $origin http://lakehouse-origin:8080;
        if ($request_method != GET) { return 405; }

        location = /_gateway-health { return 204; }
        location = /health { proxy_pass $origin; }
        location = /openapi.json { proxy_pass $origin; }
        location = /v1/data-products { proxy_pass $origin; }
        location = /v1/ingestion/status { proxy_pass $origin; }
        location = /v1/releases/latest { proxy_pass $origin; }
        location ~ ^/v1/(?:(?:cdc|sql)/)?gold/[a-z_]+$ { proxy_pass $origin; }
        location / { return 404; }
    }
}
