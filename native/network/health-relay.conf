# 個別の疎通確認を固定し、任意アプリをBlackbox Exporterと同じネットワークに置かない。
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 128; }

http {
    server_tokens off;
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 ipv6=off valid=15s;
    proxy_connect_timeout 1s;
    proxy_read_timeout 2s;
    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Host $proxy_host;
    proxy_set_header Content-Length "";

    map $uri $health_target {
        default "";
        /lakehouse http://read-api:8080/health;
        /catalog http://catalog:8181/health;
        /prometheus http://prometheus:9090/-/ready;
        /grafana http://grafana:3000/api/health;
        /browser http://data-browser:8501/_stcore/health;
        /ops http://ops-proxy:8501/_proxy-health;
        /n8n http://n8n:5678/healthz/readiness;
        /openobserve http://openobserve:5080/healthz;
        /influxdb http://influxdb3:8181/health;
        /explorer http://influx-explorer:8080/;
        /tools http://tools-portal:8060/_health;
    }

    server {
        listen 8120;
        if ($request_method != GET) { return 405; }
        location = /_relay-health { return 204; }
        location / {
            if ($health_target = "") { return 404; }
            proxy_pass $health_target;
        }
    }
}
