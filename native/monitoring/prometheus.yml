# file_sdによって、取得ジョブを編集せず監視先を追加できる。
global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: native-metrics
    static_configs:
      - targets: [prometheus:9090]
        labels: {app: Prometheus}
      - targets: [blackbox:9115]
        labels: {app: Blackbox}
      - targets: [lakehouse:8080]
        labels: {app: Lakehouse}
      - targets: [grafana:3000]
        labels: {app: Grafana}

  - job_name: app-probes
    metrics_path: /probe
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*.yml
          - /etc/prometheus/optional-targets/*.yml
          - /etc/prometheus/tool-targets/*.yml
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [module]
        target_label: __param_module
      # リレーを使う監視も、従来のinstanceラベルで履歴を引き継ぐ。
      - source_labels: [instance, __param_target]
        regex: ';(.+)'
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
