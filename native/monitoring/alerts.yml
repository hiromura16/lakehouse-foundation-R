# ルールはPrometheusのアラート画面に表示する。通知にはAlertmanagerを使う。
groups:
  - name: lakehouse-r
    rules:
      - alert: LakehouseApplicationDown
        expr: probe_success == 0 or up{job="app-probes"} == 0
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.app }} の稼働確認に失敗しました"
      - alert: LakehouseApplicationMetricsDown
        expr: up{job="native-metrics"} == 0
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.app }} のメトリクスを取得できません"
      - alert: LakehouseJobFailure
        expr: increase(lakehouse_failed_runs[15m]) > 0
        labels: {severity: warning}
        annotations:
          summary: "過去15分に変換ジョブの失敗が発生しました"
