# 閲覧用Composeを追加した環境だけで読み込む。
- targets: [http://health-relay:8120/browser]
  labels:
    app: データ閲覧
    module: http_ready
    instance: http://data-browser:8501/_stcore/health
- targets: [http://health-relay:8120/ops]
  labels:
    app: 閲覧ゲートウェイ
    module: http_ready
    instance: http://ops-proxy:8501/_proxy-health
