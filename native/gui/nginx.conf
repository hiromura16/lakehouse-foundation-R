# 閲覧画面の入口。ホスト側はループバックに限定し、遠隔利用時はTLSを終端する。
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 128;
}

http {
    access_log off;
    server_tokens off;
    proxy_temp_path /tmp/proxy;
    client_body_temp_path /tmp/client;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $http_x_forwarded_proto $forwarded_scheme {
        https https;
        default $scheme;
    }

    # 認証用ハッシュは外部ファイルに置き、上流アプリへ認証ヘッダーを送らない。
    auth_basic "Lakehouse Foundation R";
    auth_basic_user_file /run/lakehouse-auth/htpasswd;

    server {
        listen 8501;

        location = /_proxy-health {
            auth_basic off;
            return 200;
        }

        location / {
            include /etc/nginx/lakehouse-proxy.conf;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 120s;
            proxy_pass http://data-browser:8501;
        }
    }

    server {
        listen 8181;

        # 表一覧と統計の通信先は、この閲覧ゲートに揃える。
        # Consoleの更新確認など、別オリジンへのブラウザー通信を許可しない。
        add_header Content-Security-Policy "connect-src 'self'" always;

        # Lakekeeper UIは読み取り専用の統計取得をPOSTで要求する。
        # この統計経路だけPOSTを許可し、他の経路は閲覧に限定する。
        location = /management/v1/endpoint-statistics {
            limit_except GET POST {
                deny all;
            }
            include /etc/nginx/lakehouse-proxy.conf;
            proxy_pass http://catalog:8181;
        }

        # UIを使った参照を許可し、作成・変更・削除の要求はここで拒否する。
        location / {
            limit_except GET {
                deny all;
            }
            include /etc/nginx/lakehouse-proxy.conf;
            proxy_pass http://catalog:8181;
        }
    }

    server {
        listen 9090;

        location / {
            include /etc/nginx/lakehouse-proxy.conf;
            proxy_pass http://prometheus:9090;
        }
    }
}
