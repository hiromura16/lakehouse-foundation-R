# 同じ隔離環境でcompose.yamlと重ねて使う。Kafkaブローカーと
# Debeziumコネクターは上流で管理し、この構成から書き込まない。
services:
  native-cdc:
    image: ${COMPOSE_PROJECT_NAME:-lakehouse-r}-lakehouse
    pull_policy: never
    command: [python, -m, native.cdc]
    restart: on-failure:5
    user: "${LANDING_UID:?native/setup.pyで非公開設定を作成してください}:${LANDING_GID:?native/setup.pyで非公開設定を作成してください}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=268435456,mode=1777"]
    mem_limit: 2g
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?native/setup.pyで非公開設定を作成してください}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?native/setup.pyで非公開設定を作成してください}
      S3_BUCKET_RAW: lakehouse-r-raw
      S3_BUCKET_WAREHOUSE: lakehouse-r-warehouse
      WAREHOUSE_NAME: foundation-r
      WORKER_TOKEN: ${WORKER_TOKEN:?native/setup.pyで非公開設定を作成してください}
      CDC_ALLOW_PLAINTEXT: ${CDC_ALLOW_PLAINTEXT:-0}
    depends_on:
      lakehouse:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${CDC_STATE_DIR:?CDC用の非公開状態ディレクトリを指定してください}
        target: /state
        bind:
          create_host_path: false
      - type: bind
        source: ${CDC_SETTINGS_FILE:?Kafkaコンシューマーの非公開設定を指定してください}
        target: /run/cdc/settings.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CDC_TABLE_MAP_FILE:?6表の非公開マッピングを指定してください}
        target: /run/cdc/table-map.json
        read_only: true
        bind:
          create_host_path: false
      # 専用の信頼CAを使う場合にだけ、Kafka設定からこの固定パスを参照する。
      - type: bind
        source: ${CDC_BROKER_CA_FILE:-./infra/proxy/empty-ca.pem}
        target: /run/cdc/broker-ca.pem
        read_only: true
        bind:
          create_host_path: false
