# Rill DeveloperのPreviewに、ローカルのBasic認証と単一の入口を付ける。
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 64;
}

http {
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 256k;

    server {
        listen 8080;
        server_name _;
        # 上流のサポートwidgetを含め、ブラウザーに外部資産を取得させない。
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; frame-src 'none'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'" always;

        location / {
            auth_basic "Foundation R approved Gold";
            auth_basic_user_file /run/operator.htpasswd;
            proxy_pass http://rill:9009;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Authorization "";
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_buffering off;
        }
    }
}
