name: PostgreSQLソースの受入検査

on:  # yamllint disable-line rule:truthy
  push:
    paths: &postgresql_paths
      - .github/workflows/postgresql.yml
      - .github/actions/setup-pinned-uv/action.yml
      - compose.yaml
      - contracts/native/**
      - infra/proxy/**
      - infra/source/postgresql-*
      - infra/source/requirements-postgresql.*
      - medallion/**
      - native/**
      - scripts/extract-postgresql.py
      - scripts/sql_batch_worker.py
      - scripts/sql_snapshot.py
      - scripts/sqlserver_batch.py
      - tests/integration/postgresql/**
  pull_request:
    paths: *postgresql_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.15'
      - uses: ./.github/actions/setup-pinned-uv
      - name: 合成TLSと実Icebergへの反映・再送を検査
        shell: bash
        timeout-minutes: 12
        run: |
          set -Eeuo pipefail
          uv venv --python "${pythonLocation:?setup-pythonで設定してください}/bin/python" "$RUNNER_TEMP/postgresql-check"
          uv pip sync --python "$RUNNER_TEMP/postgresql-check/bin/python" \
            --require-hashes infra/source/requirements-postgresql.lock
          bash tests/integration/postgresql/run.sh "$RUNNER_TEMP/postgresql-check/bin/python"
