name: SQL Serverソースの隔離受入

on:  # yamllint disable-line rule:truthy
  push:
    paths: &sqlserver_paths
      - .github/workflows/sqlserver.yml
      - .github/actions/setup-pinned-uv/action.yml
      - infra/source/sqlserver-tables.example.json
      - medallion/sources.json
      - scripts/cdc_sql_contract.py
      - scripts/extract-sqlserver.py
      - scripts/generate-demo.py
      - scripts/sqlserver_demo.py
      - scripts/sqlserver_safety.sql
      - scripts/sqlserver_writer_legacy_policy.sql
      - scripts/sqlserver_writer_legacy_delegation.sql
      - tests/integration/sqlserver/**
  pull_request:
    paths: *sqlserver_paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pinned-uv
      - name: 六表の読取、固定DML・権限とTLSを合成DBで確認
        shell: bash
        run: |
          set -Eeuo pipefail
          uv venv --python 3.14 "$RUNNER_TEMP/sqlserver-check"
          uv pip sync --python "$RUNNER_TEMP/sqlserver-check/bin/python" \
            --require-hashes --only-binary :all: tests/integration/sqlserver/requirements.lock
          bash tests/integration/sqlserver/run.sh "$RUNNER_TEMP/sqlserver-check/bin/python"

  cdc-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pinned-uv
      - name: 独立CDCのSQL契約と権限を合成DBだけで確認
        shell: bash
        run: |
          set -Eeuo pipefail
          uv venv --python 3.14 "$RUNNER_TEMP/sqlserver-cdc-check"
          uv pip sync --python "$RUNNER_TEMP/sqlserver-cdc-check/bin/python" \
            --require-hashes --only-binary :all: tests/integration/sqlserver/requirements.lock
          bash tests/integration/sqlserver/run.sh --cdc-contract "$RUNNER_TEMP/sqlserver-cdc-check/bin/python"
