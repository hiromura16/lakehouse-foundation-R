name: SQL Serverソースの隔離受入

on:  # yamllint disable-line rule:truthy
  push:
    paths: &sqlserver_paths
      - .github/workflows/sqlserver.yml
      - infra/source/sqlserver-tables.example.json
      - medallion/sources.json
      - scripts/extract-sqlserver.py
      - scripts/generate-demo.py
      - tests/integration/sqlserver/**
  pull_request:
    paths: *sqlserver_paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: '0.13.7'
          checksum: c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83
          enable-cache: false
      - name: 六表の読取、同時変更とTLSを合成DBで確認
        shell: bash
        run: |
          set -Eeuo pipefail
          uv venv --python 3.14 "$RUNNER_TEMP/sqlserver-check"
          uv pip sync --python "$RUNNER_TEMP/sqlserver-check/bin/python" \
            --require-hashes --only-binary :all: tests/integration/sqlserver/requirements.lock
          bash tests/integration/sqlserver/run.sh "$RUNNER_TEMP/sqlserver-check/bin/python"
