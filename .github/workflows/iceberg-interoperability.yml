name: RisingWaveとIceberg V2の相互運用

on:  # yamllint disable-line rule:truthy
  push:
    paths:
      - native/requirements.lock
      - native/evaluation/risingwave.toml
      - native/evaluation/telemetry-wire.sql
      - tests/integration/iceberg/**
      - tests/integration/compose_images.py
      - .github/workflows/iceberg-interoperability.yml
  pull_request:
    paths:
      - native/requirements.lock
      - native/evaluation/risingwave.toml
      - native/evaluation/telemetry-wire.sql
      - tests/integration/iceberg/**
      - tests/integration/compose_images.py
      - .github/workflows/iceberg-interoperability.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  append:
    runs-on: ubuntu-latest
    # 固定イメージの取得を最長2回とし、受入と後片付けの時間を確保する。
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: '0.13.9'
          checksum: c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83
          enable-cache: false
      - name: Kafkaの追記・カタログ復旧・設備原本バイトのPyIceberg照合
        shell: bash
        run: |
          set -Eeuo pipefail
          iceberg="$RUNNER_TEMP/iceberg-client"
          uv venv --python 3.14 "$iceberg"
          uv pip sync --python "$iceberg/bin/python" --require-hashes \
            --only-binary :all: tests/integration/iceberg/requirements-runner.lock
          "$iceberg/bin/python" tests/integration/iceberg/acceptance.py

  upsert:
    runs-on: ubuntu-latest
    # 固定イメージの取得を最長2回とし、受入と後片付けの時間を確保する。
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: '0.13.9'
          checksum: c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83
          enable-cache: false
      - name: CDC更新・削除とIceberg V2の読取・障害復旧を照合
        shell: bash
        run: |
          set -Eeuo pipefail
          iceberg="$RUNNER_TEMP/iceberg-client"
          uv venv --python 3.14 "$iceberg"
          uv pip sync --python "$iceberg/bin/python" --require-hashes \
            --only-binary :all: tests/integration/iceberg/requirements-runner.lock
          "$iceberg/bin/python" tests/integration/iceberg/acceptance.py --upsert
