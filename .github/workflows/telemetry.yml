name: 工場MQTT・OPC UA・Modbusの隔離受入

on:  # yamllint disable-line rule:truthy
  push:
    paths:
      - compose.evaluation.yaml
      - compose.telemetry.yaml
      - compose.telemetry.nisshi.yaml
      - native/telemetry/**
      - tests/integration/telemetry/**
      - tests/integration/modbus/**
      - .github/workflows/telemetry.yml
  pull_request:
    paths:
      - compose.evaluation.yaml
      - compose.telemetry.yaml
      - compose.telemetry.nisshi.yaml
      - native/telemetry/**
      - tests/integration/telemetry/**
      - tests/integration/modbus/**
      - .github/workflows/telemetry.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  equipment:
    name: ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: MQTTとRedpanda
            script: tests/integration/telemetry/acceptance.py
            args: ''
          - scenario: OPC UAとRedpanda
            script: tests/integration/telemetry/acceptance.py
            args: --opcua
          - scenario: Modbus TCP
            script: tests/integration/modbus/acceptance.py
            args: ''
          - scenario: Modbus RTU仮想シリアル
            script: tests/integration/modbus/rtu/acceptance.py
            args: ''
          - scenario: MQTTとNisshi
            script: tests/integration/telemetry/acceptance.py
            args: --nisshi
          - scenario: OPC UAとNisshi
            script: tests/integration/telemetry/acceptance.py
            args: --nisshi --opcua
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: 合成設備と保存先で値・時刻・権限を照合
        run: python3 "${{ matrix.script }}" ${{ matrix.args }}
