name: Validate public source

on:  # yamllint disable-line rule:truthy
  push:
  pull_request:
  workflow_dispatch:

# 検査には読取権限だけを使い、デプロイトークンや会社の秘密情報は使わない。
permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      UV_PYTHON_DOWNLOADS: never
      UV_NO_CONFIG: '1'
    steps:
    # 公式の安定版を2026-11-09時点のコミットに固定。
    - name: Check out complete public history
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: '3.12'
    - name: Prepare Bash and Zsh syntax checkers
      shell: bash
      run: |
        set -Eeuo pipefail
        if ! command -v zsh >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes zsh
        fi
        bash --version
        zsh --version
    - name: Set up pinned uv
      uses: ./.github/actions/setup-pinned-uv
    - name: Create isolated source-quality environment
      shell: bash
      run: |
        set -Eeuo pipefail
        uv venv --python 3.12 "$RUNNER_TEMP/lakehouse-tools"
        uv pip sync --python "$RUNNER_TEMP/lakehouse-tools/bin/python" \
          --require-hashes requirements-dev.lock
        printf '%s\n' "$RUNNER_TEMP/lakehouse-tools/bin" >> "$GITHUB_PATH"
    - name: Install checksum-pinned source scanners
      shell: bash
      run: |
        set -Eeuo pipefail
        tools="$RUNNER_TEMP/source-scanners"
        mkdir -p "$tools"
        curl --fail --location --retry 3 --output "$tools/shellcheck.tar.gz" \
          https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.gz
        echo "b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6  $tools/shellcheck.tar.gz" | sha256sum --check
        tar -xzf "$tools/shellcheck.tar.gz" -C "$tools"
        curl --fail --location --retry 3 --output "$tools/gitleaks.tar.gz" \
          https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
        echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $tools/gitleaks.tar.gz" | sha256sum --check
        tar -xzf "$tools/gitleaks.tar.gz" -C "$tools" gitleaks
        printf '%s\n' "$tools" "$tools/shellcheck-v0.11.0" >> "$GITHUB_PATH"
    - name: Check every YAML and shell source including hidden directories
      run: python scripts/check_ci_sources.py
    - name: Scan complete target history and current files with Gitleaks
      # HEADの全祖先を検査する。PR差分限定でも別のローカル枝全体でもない。
      # 値を全redactし、秘密値を含み得るreport/artifactは作成しない。
      shell: bash
      run: |
        set -Eeuo pipefail
        gitleaks git --redact=100 --no-banner --log-opts=HEAD .
        gitleaks dir --redact=100 --no-banner .
    - name: Check publishable source and history
      run: python scripts/check-source.py --history
    - name: Check Python imports and formatting
      run: |
        ruff check .
        ruff format --check .
        pycodestyle --max-line-length=79 native scripts tests infra
    - name: Pythonの構文とユニットテスト
      run: |
        python -m compileall -q native scripts infra tests
        python -m unittest discover -s tests
    - name: 入力契約とドキュメント
      run: |
        python native/check_contracts.py
        python scripts/documentation.py --check
        python scripts/shell_examples.py --check
    - name: 業務SQLの静的検査
      run: sqlfluff lint --dialect duckdb medallion
    - name: SQL Server用の読取前検査の構文
      run: sqlfluff parse --dialect tsql scripts/sqlserver_safety.sql
    - name: 各Compose構成の設定を検証
      shell: bash
      run: |
        set -Eeuo pipefail
        site="$RUNNER_TEMP/foundation-r/site.env"
        tools="$RUNNER_TEMP/foundation-r/tools"
        python native/setup.py --output "$site" --landing "$RUNNER_TEMP/foundation-r-landing"
        python native/tools/setup.py --directory "$tools"
        printf 'LAKEHOUSE_OPS_HTPASSWD=%s\n' "$tools/operator.htpasswd" >> "$site"
        docker compose --env-file "$site" config --quiet
        docker compose --env-file "$site" \
          -f compose.yaml -f compose.alerting.yaml config --quiet
        CDC_STATE_DIR="$tools" CDC_SETTINGS_FILE="$tools/settings.json" \
          CDC_TABLE_MAP_FILE="$tools/table-map.json" COMPOSE_PROJECT_NAME=lakehouse-r \
          docker compose --env-file "$site" -f compose.yaml -f compose.cdc.yaml config --quiet
        docker compose --env-file "$site" --env-file "$tools/tools.env" \
          --profile tools-metrics -f compose.yaml -f compose.gui.yaml \
          -f compose.tools.yaml config --quiet
