name: 閉域CDCの型不正隔離と不正JSON停止

on:  # yamllint disable-line rule:truthy
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/cdc-poison.yml
      - .dockerignore
      - compose.yaml
      - compose.cdc.yaml
      - native/**
      - medallion/**
      - contracts/native/**
      - infra/proxy/**
      - infra/cdc/**
      - tests/integration/native/compose.broker.yaml
      - tests/integration/native/compose.cdc-continuity.yaml
      - tests/integration/native/cdc_acceptance.py
      - tests/integration/native/cdc_checkpoint.py
      - tests/integration/native/prepare_cdc.py
      - tests/integration/native/compose.cdc-storage-failure.yaml
      - tests/test_cdc_poison_acceptance.py
      - scripts/cdc_local_continuity.py
      - scripts/cdc_storage_failure.py
      - scripts/cdc_poison_acceptance.py
      - scripts/influx_local_acceptance.py

permissions:
  contents: read

jobs:
  typed-quarantine-and-malformed-stop:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: 型不正の隔離後に良品が進み、不正JSONは確認せず停止
        run: python3 -m scripts.cdc_poison_acceptance
