name: Renovate

on:  # yamllint disable-line rule:truthy
  pull_request:
    paths:
      - renovate.json
      - .github/workflows/renovate.yml
  push:
    paths:
      - renovate.json
      - .github/workflows/renovate.yml
  schedule:
    # 18:23 UTCは翌日03:23 JST。毎日、更新候補を確認する。
    - cron: '23 18 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 更新候補を確認する（PRやIssueを作成しない）
        type: boolean
        default: true

permissions:
  contents: read

env:
  # PR側の設定検証と定期実行で同じリリース・イメージを使用する。
  RENOVATE_IMAGE: ghcr.io/renovatebot/renovate:45.1.1@sha256:37bbe1af56aa094e6fa5c3b22c5ea28338e99bb99c4729b16aa1f4e8027286dc

jobs:
  validate:
    name: Renovate設定の検証
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 検証対象を取得する
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: 公式バリデーターで設定を検証する
        shell: bash
        run: |
          set -Eeuo pipefail
          # 検証プロセスには読み取り専用の作業コピーだけを渡す。
          docker run --rm --network none \
            --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work \
            --entrypoint renovate-config-validator "$RENOVATE_IMAGE" \
            --strict --no-global renovate.json

  update:
    name: 依存の更新候補を確認する
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      issues: read
      pull-requests: read
    concurrency:
      group: renovate-updates
      cancel-in-progress: false
    steps:
      - name: このリポジトリの更新候補を確認する
        shell: bash
        env:
          READ_TOKEN: ${{ github.token }}
          WRITE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          MANUAL_DRY_RUN: ${{ inputs.dry_run }}
          RENOVATE_PLATFORM: github
          RENOVATE_AUTODISCOVER: 'false'
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
        run: |
          set -Eeuo pipefail
          # シークレットのない初回や手動確認は、読み取りトークンで候補確認だけを行う。
          if [[ -n "$WRITE_TOKEN" && "$MANUAL_DRY_RUN" != true ]]; then
            export RENOVATE_TOKEN="$WRITE_TOKEN"
            unset RENOVATE_DRY_RUN
          else
            export RENOVATE_TOKEN="$READ_TOKEN"
            export RENOVATE_DRY_RUN=full
            echo '::notice::ドライランで実行します。更新候補はログで確認できます。'
          fi

          docker run --rm \
            --env RENOVATE_TOKEN --env RENOVATE_DRY_RUN \
            --env RENOVATE_PLATFORM --env RENOVATE_AUTODISCOVER \
            --env RENOVATE_ONBOARDING --env RENOVATE_REQUIRE_CONFIG \
            "$RENOVATE_IMAGE" "$GITHUB_REPOSITORY"
