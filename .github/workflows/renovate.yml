name: Renovate

on:  # yamllint disable-line rule:truthy
  pull_request:
    paths:
      - renovate.json
      - .github/workflows/renovate.yml
  push:
    paths:
      - renovate.json
      - .github/workflows/renovate.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  # 公式バリデーターを同じイメージで再実行できるように固定する。
  RENOVATE_IMAGE: ghcr.io/renovatebot/renovate:45.1.1@sha256:37bbe1af56aa094e6fa5c3b22c5ea28338e99bb99c4729b16aa1f4e8027286dc

jobs:
  validate:
    name: Renovate設定の検証
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 検証対象を取得する
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: 公式バリデーターで設定を検証する
        shell: bash
        run: |
          set -Eeuo pipefail
          # 検証プロセスには読み取り専用の作業コピーだけを渡す。
          docker run --rm --network none \
            --volume "$GITHUB_WORKSPACE:/work:ro" --workdir /work \
            --entrypoint renovate-config-validator "$RENOVATE_IMAGE" \
            --strict --no-global renovate.json
