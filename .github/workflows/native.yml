name: Foundation R 標準構成の受入検査

on:  # yamllint disable-line rule:truthy
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: '0.13.7'
          checksum: c5221ff41b7892bfc223543883600125f6a47fe845093e0f5bdff4f359196d83
          enable-cache: false
      - name: 固定した業務契約のハッシュを照合
        run: python3 native/check_contracts.py
      - name: 隔離したCompose構成を検査して起動
        shell: bash
        run: |
          set -Eeuo pipefail
          site="$RUNNER_TEMP/native-site.env"
          landing="$RUNNER_TEMP/native-landing"
          auth="$RUNNER_TEMP/native-htpasswd"
          python3 native/setup.py --output "$site" --landing "$landing"
          umask 077
          password=$(openssl rand -hex 24)
          hash=$(printf '%s\n' "$password" | openssl passwd -6 -stdin)
          printf 'operator:%s\n' "$hash" > "$auth"
          printf 'OPS_USER=operator\nOPS_PASSWORD=%s\n' "$password" \
            > "$RUNNER_TEMP/native-operator.env"
          printf '%s\n' LAKEHOUSE_API_PORT=18502 LAKEHOUSE_GRAFANA_PORT=18501 \
            "LAKEHOUSE_OPS_HTPASSWD=$auth" >> "$site"
          docker compose --env-file "$site" config --quiet
          docker compose --env-file "$site" -p native-ci \
            -f compose.yaml -f compose.gui.yaml config --quiet
          docker compose --env-file "$site" -p native-ci \
            -f compose.yaml -f compose.gui.yaml up \
            -d --build --wait --wait-timeout 180
      - name: 業務SQL・公開世代・定期ジョブ・閲覧画面を検査
        shell: bash
        run: |
          set -Eeuo pipefail
          site="$RUNNER_TEMP/native-site.env"
          container=$(docker compose --env-file "$site" -p native-ci \
            -f compose.yaml -f compose.gui.yaml ps -q lakehouse)
          python3 tests/integration/native/acceptance.py \
            --env-file "$RUNNER_TEMP/native-site.env" \
            --landing "$RUNNER_TEMP/native-landing" --api-port 18502 \
            --grafana-port 18501 --gui-env-file "$RUNNER_TEMP/native-operator.env" \
            --schedule-container "$container"
          docker exec -i "$container" python - < tests/integration/native/gold_stream.py
          docker exec -i "$container" python - < tests/integration/native/gold_admission.py
          docker compose --env-file "$RUNNER_TEMP/native-site.env" -p native-ci \
            exec -T prometheus promtool check config /etc/prometheus/prometheus.yml
          docker compose --env-file "$RUNNER_TEMP/native-site.env" -p native-ci \
            exec -T blackbox /bin/blackbox_exporter \
            --config.file=/etc/blackbox/blackbox.yml --config.check
      - name: MCPで公開世代の参照と読取制限を確認
        shell: bash
        run: |
          set -Eeuo pipefail
          mcp="$RUNNER_TEMP/native-mcp"
          uv venv --python 3.12 "$mcp"
          uv pip sync --python "$mcp/bin/python" --require-hashes \
            --only-binary :all: examples/ai/requirements-mcp.lock
          "$mcp/bin/python" tests/integration/native/mcp_acceptance.py \
            --env-file "$RUNNER_TEMP/native-site.env" --api-port 18502
      - name: 自動化・時系列・監視転送を検証
        shell: bash
        run: |
          set -Eeuo pipefail
          site="$RUNNER_TEMP/native-site.env"
          tools="$RUNNER_TEMP/native-tools"
          python3 native/tools/setup.py --directory "$tools"
          docker compose --env-file "$site" --env-file "$tools/tools.env" -p native-ci \
            -f compose.yaml -f compose.gui.yaml -f compose.tools.yaml \
            up -d --build --wait --wait-timeout 240
          python3 -m native.tools.demo --token-file "$tools/influx-admin.json"
          python3 -m native.tools.observe provision --directory "$tools"
          docker compose --env-file "$site" --env-file "$tools/tools.env" -p native-ci \
            -f compose.yaml -f compose.gui.yaml -f compose.tools.yaml \
            --profile tools-metrics up -d --wait --wait-timeout 90
          for attempt in {1..12}; do
            if python3 -m native.tools.observe verify --directory "$tools"; then
              break
            fi
            test "$attempt" -lt 12
            sleep 5
          done
          python3 tests/integration/native/tools_acceptance.py "$tools"
          python3 tests/integration/native/network_acceptance.py \
            --project native-ci --site "$site" --tools "$tools/tools.env"
      - name: 停止ボリュームを採取し、保全後の破損を検出
        shell: bash
        run: |
          set -Eeuo pipefail
          site="$RUNNER_TEMP/native-site.env"
          tools="$RUNNER_TEMP/native-tools"
          proof="$RUNNER_TEMP/native-volume-proof"
          dc=(docker compose --env-file "$site" --env-file "$tools/tools.env"
            -p native-ci -f compose.yaml -f compose.gui.yaml -f compose.tools.yaml
            --profile tools-metrics)
          if python3 scripts/backup-native.py capture --project native-ci "$proof"; then
            exit 1
          fi
          test ! -e "$proof"
          "${dc[@]}" stop --timeout 30
          python3 scripts/backup-native.py capture --project native-ci "$proof" > "$RUNNER_TEMP/native-capture.json"
          python3 scripts/backup-native.py verify "$proof" > "$RUNNER_TEMP/native-verify.json"
          cmp "$RUNNER_TEMP/native-capture.json" "$RUNNER_TEMP/native-verify.json"
          printf '%s' 'fixture-tamper' >> "$proof/volume-001.tar"
          if python3 scripts/backup-native.py verify "$proof"; then
            exit 1
          fi
      - name: 失敗したジョブの分類と発生箇所を記録
        if: failure()
        shell: bash
        run: |
          site="$RUNNER_TEMP/native-site.env"
          if test -f "$site"; then
            docker compose -p native-ci --env-file "$site" \
              -f compose.yaml logs --no-log-prefix lakehouse \
              | grep -F '"event": "native.operation_failed"' || true
          fi
      - name: 試験プロジェクトと合成データを破棄
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/native-site.env"; then
            site="$RUNNER_TEMP/native-site.env"
            tools="$RUNNER_TEMP/native-tools/tools.env"
            if test -f "$tools"; then
              docker compose --env-file "$site" --env-file "$tools" -p native-ci \
                -f compose.yaml -f compose.gui.yaml -f compose.tools.yaml \
                --profile tools-metrics down --volumes --remove-orphans
            else
              docker compose --env-file "$site" -p native-ci \
                -f compose.yaml -f compose.gui.yaml down --volumes --remove-orphans
            fi
          fi
