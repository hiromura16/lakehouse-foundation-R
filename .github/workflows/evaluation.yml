name: ネイティブ処理系の合成データ比較

on:  # yamllint disable-line rule:truthy
  push:
    paths: &engine_paths
      - .github/workflows/evaluation.yml
      - .github/actions/setup-pinned-uv/action.yml
      - compose.evaluation.yaml
      - compose.tools.yaml
      - native/tools/influx.Dockerfile
      - medallion/**
      - native/catalog_schema.py
      - native/engine.py
      - native/evaluation/**
      - native/requirements.lock
      - scripts/generate-demo.py
      - scripts/raw_file_input.py
  pull_request:
    paths: *engine_paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engines:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.15'
      - uses: ./.github/actions/setup-pinned-uv
      - name: 合成環境と共通クライアントを準備
        shell: bash
        run: |
          set -Eeuo pipefail
          docker compose -f compose.evaluation.yaml --profile '*' config --quiet
          uv venv --python 3.12 "$RUNNER_TEMP/engine-check"
          uv pip sync --python "$RUNNER_TEMP/engine-check/bin/python" \
            --require-hashes native/evaluation/compute.lock
          docker compose -f compose.evaluation.yaml --profile sail --profile timeseries \
            --profile stream --profile distributed up -d --build --wait --wait-timeout 180
      - name: SailとDataFusionの現行値、GreptimeDBの時系列、Ballistaの分散SQL
        shell: bash
        run: |
          set -Eeuo pipefail
          "$RUNNER_TEMP/engine-check/bin/python" -m native.evaluation.compute sail
          "$RUNNER_TEMP/engine-check/bin/python" -m native.evaluation.compute datafusion
          for attempt in {1..15}; do
            if python3 -m native.evaluation.greptime; then break; fi
            test "$attempt" -lt 15
            sleep 2
          done
          docker compose -f compose.evaluation.yaml --profile distributed-check \
            run --rm --build ballista-check
      - name: RisingWaveで作成・更新・削除と再開後の現在値を確認
        shell: bash
        run: |
          set -Eeuo pipefail
          pgimage='postgres:18.6-alpine@sha256:300ebd02c6d4de9ee27ad7f6855d5d21b4d3a4a5117767c1197d284c635d9736'
          run_sql() {
            docker run --rm -i --network foundation-r-evaluation_default "$pgimage" \
              psql -X -v ON_ERROR_STOP=1 -h risingwave -p 4566 -U root -d dev "$@"
          }
          for attempt in {1..20}; do
            if run_sql -qAtc 'SELECT 1'; then break; fi
            test "$attempt" -lt 20
            sleep 3
          done
          docker compose -f compose.evaluation.yaml exec -T broker \
            rpk topic create foundation-r-evaluation-products --partitions 1
          run_sql < native/evaluation/stream.sql
          docker compose -f compose.evaluation.yaml exec -T broker \
            rpk topic produce foundation-r-evaluation-products < native/evaluation/stream-events.jsonl
          query='SELECT product_id, revision, cycle FROM evaluation_current ORDER BY product_id'
          assert_state() {
            for attempt in {1..20}; do
              if result=$(run_sql -qAtc "$query") && test "$result" = 'P1|20|14.25'; then
                printf '%s\n' "$result"
                return
              fi
              sleep 2
            done
            return 1
          }
          assert_state
          docker compose -f compose.evaluation.yaml restart risingwave
          assert_state
      - name: Spark上のComet物理プランを照合
        run: |
          docker compose -f compose.evaluation.yaml --profile accelerator \
            run --rm --build comet
      - name: 合成環境の専用volumeを破棄
        if: always()
        run: docker compose -f compose.evaluation.yaml --profile '*' down --volumes


  business-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pinned-uv
      - name: 同じIceberg入力から二つのエンジンで業務表を再構築
        shell: bash
        run: |
          set -Eeuo pipefail
          eval_env="$RUNNER_TEMP/business-sql"
          uv venv --python 3.14 "$eval_env"
          uv pip sync --python "$eval_env/bin/python" --require-hashes \
            --only-binary :all: native/requirements.lock \
            native/evaluation/parquet_benchmark.lock \
            native/evaluation/business_parity.lock
          "$eval_env/bin/python" -m native.evaluation.business_parity
          "$eval_env/bin/python" -m native.evaluation.typed_gold_benchmark --orders 200

  factory-timeseries:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: 同じ24時間の設備データを時系列DB2種で照合
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$RUNNER_TEMP/factory-timeseries"
          site="$stage/site.env"
          tools="$stage/tools"
          python3 native/setup.py --output "$site" --landing "$stage/landing"
          python3 native/tools/setup.py --directory "$tools"
          influx=(docker compose -p fr-ts-ci-influx --env-file "$site" --env-file "$tools/tools.env"
            -f compose.yaml -f compose.tools.yaml)
          greptime=(docker compose -p fr-ts-ci-greptime -f compose.evaluation.yaml --profile timeseries)
          cleanup() {
            "${influx[@]}" down --volumes
            "${greptime[@]}" down --volumes
          }
          trap cleanup EXIT
          wait_greptime() {
            curl --disable --fail --silent --noproxy '*' --retry-all-errors \
              --retry 20 --retry-delay 1 http://127.0.0.1:18603/health >/dev/null
          }
          "${influx[@]}" up -d --build --wait --wait-timeout 120 influxdb3
          "${greptime[@]}" up -d greptime
          wait_greptime
          compare=(python3 -m native.evaluation.timeseries_compare
            --database foundation_eval_ts_20260101 --influx-port 18510
            --greptime-port 18603 --token-file "$tools/influx-admin.json")
          "${compare[@]}" | tee "$stage/before.json"
          "${influx[@]}" stop --timeout 25 influxdb3
          "${greptime[@]}" stop --timeout 25 greptime
          "${influx[@]}" up -d --no-build --pull never --wait --wait-timeout 120 influxdb3
          "${greptime[@]}" up -d --no-build --pull never greptime
          wait_greptime
          "${compare[@]}" --verify-only | tee "$stage/after.json"
          python3 - "$stage" <<'PY'
          import json
          import sys
          from pathlib import Path

          stage = Path(sys.argv[1])
          before, after = (
              json.loads((stage / f"{phase}.json").read_text())
              for phase in ("before", "after")
          )
          expected = ("points", "minute_groups", "input_sha256", "result_sha256")
          for field in expected:
              assert before[field] == after[field], field
          assert before["points"] == 5760 and before["minute_groups"] == 2880
          PY
