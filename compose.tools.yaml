# Foundation Rの運用ツールを追加する。すべてのホストポートはループバックに限定する。
x-tool-logging: &tool-logging
  driver: json-file
  options: {max-size: 10m, max-file: '3'}

services:
  tools-db:
    networks:
      automation_db: {}
    image: postgres:18.7-alpine3.24@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    environment:
      POSTGRES_DB: automation
      POSTGRES_USER: automation
      POSTGRES_PASSWORD: ${TOOLS_DB_PASSWORD:?追加ツールの専用設定を生成してください}
    volumes:
      - tools-db:/var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, -U, automation, -d, automation]
      interval: 5s
      timeout: 3s
      retries: 24
    restart: unless-stopped
    mem_limit: 256m
    logging: *tool-logging

  n8n:
    networks:
      automation_db: {}
      automation_apps: {}
    image: ${COMPOSE_PROJECT_NAME:-lakehouse-r}-n8n
    pull_policy: build
    build:
      context: .
      dockerfile: native/Dockerfile.configured
      target: n8n
      args:
        N8N_IMAGE_REPO: ${N8N_IMAGE_REPO:-ghcr.io/n8n-io/n8n}
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: tools-db
      DB_POSTGRESDB_DATABASE: automation
      DB_POSTGRESDB_USER: automation
      DB_POSTGRESDB_PASSWORD: ${TOOLS_DB_PASSWORD:?追加ツールの専用設定を生成してください}
      N8N_ENCRYPTION_KEY: ${TOOLS_N8N_KEY:?追加ツールの専用設定を生成してください}
      N8N_EDITOR_BASE_URL: ${TOOLS_N8N_URL:-http://localhost:18507/}
      N8N_WEBHOOK_URL: ${TOOLS_N8N_URL:-http://localhost:18507/}
      N8N_PROXY_HOPS: ${TOOLS_N8N_PROXY_HOPS:-1}
      N8N_SECURE_COOKIE: ${TOOLS_SECURE_COOKIES:-false}
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      N8N_COMMUNITY_PACKAGES_ENABLED: 'false'
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'true'
      N8N_SSRF_PROTECTION_ENABLED: 'true'
      N8N_SSRF_BLOCKED_IP_RANGES: default,100.64.0.0/10
      # 同梱フローが参照する固定の内部宛先だけを明示する。
      N8N_SSRF_ALLOWED_HOSTNAMES: lakehouse
      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: '168'
      GENERIC_TIMEZONE: Asia/Tokyo
      TZ: Asia/Tokyo
    volumes:
      - tools-n8n:/home/node/.n8n
    depends_on:
      tools-db:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 24
    restart: unless-stopped
    mem_limit: 1024m
    logging: *tool-logging

  openobserve:
    networks:
      tools_apps: {}
    build:
      context: .
      dockerfile: infra/openobserve/Dockerfile
      args:
        OPENOBSERVE_IMAGE_PATH: ${OPENOBSERVE_IMAGE_PATH:-docker.io/openobserve/openobserve}
    environment:
      ZO_ROOT_USER_EMAIL: ${TOOLS_OBSERVE_USER:?追加ツールの専用設定を生成してください}
      ZO_ROOT_USER_PASSWORD: ${TOOLS_OBSERVE_PASSWORD:?追加ツールの専用設定を生成してください}
      ZO_HTTP_ADDR: 0.0.0.0
      ZO_HTTP_PORT: '5080'
      ZO_LOCAL_MODE: 'true'
      ZO_LOCAL_MODE_STORAGE: disk
      ZO_META_STORE: sqlite
      ZO_DATA_DIR: /data/
      ZO_COMPACT_DATA_RETENTION_DAYS: '7'
      ZO_TELEMETRY: 'false'
      ZO_USAGE_REPORTING_MODE: local
      ZO_TRACING_ENABLED: 'false'
      ZO_MEM_TABLE_MAX_SIZE: '128'
      ZO_MEMORY_CACHE_ENABLED: 'false'
      ZO_HTTP_WORKER_NUM: '2'
      ZO_QUERY_THREAD_NUM: '2'
    volumes:
      - tools-observe:/data
    ports:
      - 127.0.0.1:${TOOLS_OBSERVE_PORT:-18508}:5080
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, /bin/busybox, sh, /etc/lakehouse-openobserve/health.sh]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    mem_limit: 2g
    logging: *tool-logging

  observe-forwarder:
    networks:
      tools_apps: {}
      metrics_view: {}
    profiles: [tools-metrics]
    image: prom/prometheus:v3.16.0@sha256:89c1a644817e9ad70fa2af76c84898e327c1de7063735f962e8313b1e28672c3
    user: "${LANDING_UID}:${LANDING_GID}"
    command:
      - --agent
      - --config.file=/etc/prometheus/forward.yml
      - --storage.agent.path=/tmp/wal
    configs:
      - source: observe-forward
        target: /etc/prometheus/forward.yml
    secrets: [observe-passcode]
    tmpfs: ["/tmp:size=128m,mode=1777"]
    depends_on:
      openobserve:
        condition: service_healthy
      prometheus:
        condition: service_started
    restart: unless-stopped
    mem_limit: 256m
    logging: *tool-logging

  influxdb3:
    networks:
      tools_apps: {}
    build:
      context: .
      dockerfile: native/tools/influx.Dockerfile
      args:
        TOOLS_UID: ${LANDING_UID}
        TOOLS_GID: ${LANDING_GID}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command:
      - influxdb3
      - serve
      - --node-id=foundation
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --admin-token-file=/run/secrets/influx-admin
      - --disable-authz=health
    environment:
      # 設備データの保存とSQLに限定し、Pythonプラグインを初期化しない。
      INFLUXDB3_UNSET_VARS: INFLUXDB3_PLUGIN_DIR
    volumes:
      - tools-influx:/var/lib/influxdb3/data
    secrets: [influx-admin]
    ports:
      - 127.0.0.1:${TOOLS_INFLUX_PORT:-18510}:8181
    healthcheck:
      test: [CMD, curl, --noproxy, '*', --fail, --silent, http://127.0.0.1:8181/health]
      interval: 10s
      timeout: 4s
      retries: 15
    restart: unless-stopped
    mem_limit: 1536m
    logging: *tool-logging

  influx-explorer:
    networks:
      tools_apps: {}
    image: docker.io/influxdata/influxdb3-ui:1.11.2@sha256:7bc3e9caf1c2334a301bfc6b08eb6012cb5b33db9f0f0dd8f86d9b3553343e86
    command: ["--mode=query"]
    environment:
      SESSION_SECRET_KEY: ${TOOLS_EXPLORER_KEY:?追加ツールの専用設定を生成してください}
      COOKIE_SECURE: ${TOOLS_SECURE_COOKIES:-false}
    volumes:
      - tools-explorer:/db
    restart: unless-stopped
    # 接続UIの起動直後にも約220 MiB使用するため、SQL表示の余裕を確保する。
    mem_limit: 512m
    logging: *tool-logging

  tools-portal:
    networks:
      tools_apps: {}
      automation_apps: {}
    image: ${COMPOSE_PROJECT_NAME:-lakehouse-r}-tools-portal
    pull_policy: build
    build:
      context: .
      dockerfile: native/Dockerfile.configured
      target: tools-portal
    entrypoint: [nginx]
    command: [-g, daemon off;]
    user: "${LANDING_UID}:${LANDING_GID}"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=32m,mode=1777"]
    configs:
      - source: tools-ports
        target: /etc/foundation-tools/ports.json
    secrets: [tools-htpasswd]
    ports:
      - 127.0.0.1:${TOOLS_PORT:-18506}:8060
      - 127.0.0.1:${TOOLS_N8N_PORT:-18507}:8061
      - 127.0.0.1:${TOOLS_EXPLORER_PORT:-18509}:8062
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8060/_health"]
      interval: 10s
      timeout: 4s
      retries: 12
    restart: unless-stopped
    mem_limit: 96m
    logging: *tool-logging

  read-api:
    networks:
      automation_apps:
        aliases: [lakehouse]

  health-relay:
    networks:
      tools_apps: {}
      automation_apps: {}

  prometheus:
    build:
      args:
        TOOL_TARGETS: '1'

networks:
  automation_db:
    internal: true
  automation_apps:
  tools_apps:

configs:
  tools-ports:
    content: |
      {"grafana":${LAKEHOUSE_GRAFANA_PORT:-18501},"lakehouse":${LAKEHOUSE_API_PORT:-18502},
       "browser":${LAKEHOUSE_BROWSER_PORT:-18503},"catalog":${LAKEHOUSE_CATALOG_PORT:-18504},
       "prometheus":${LAKEHOUSE_PROMETHEUS_PORT:-18505},"n8n":${TOOLS_N8N_PORT:-18507},
       "openobserve":${TOOLS_OBSERVE_PORT:-18508},"explorer":${TOOLS_EXPLORER_PORT:-18509},
       "influxdb":${TOOLS_INFLUX_PORT:-18510}}
  observe-forward:
    content: |
      global:
        scrape_interval: 15s
      scrape_configs:
        - job_name: foundation-federation
          honor_labels: true
          metrics_path: /federate
          params:
            'match[]':
              - '{__name__=~"probe_success|probe_duration_seconds|lakehouse_.*"}'
          static_configs:
            - targets: [prometheus:9090]
      remote_write:
        - url: http://openobserve:5080/api/default/prometheus/api/v1/write
          basic_auth:
            username: ${TOOLS_OBSERVE_USER:?追加ツールの専用設定を生成してください}
            password_file: /run/secrets/observe-passcode

secrets:
  influx-admin:
    file: ${TOOLS_INFLUX_TOKEN_FILE:?追加ツールの専用設定を生成してください}
  observe-passcode:
    file: ${TOOLS_OBSERVE_PASSCODE_FILE:?追加ツールの専用設定を生成してください}
  tools-htpasswd:
    file: ${TOOLS_HTPASSWD:?追加ツールの専用設定を生成してください}

volumes:
  tools-db:
  tools-n8n:
  tools-observe:
  tools-influx:
  tools-explorer:
