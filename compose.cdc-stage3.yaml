# 専用ファイル。通常のComposeとは重ねず、stage3を明示したときだけ起動。
name: foundation-r-cdc-stage3
services:
  stage3-broker:
    profiles: [stage3]
    image: "${CDC_STAGE3_KAFKA_IMAGE:?select the verified Stage 3 Kafka image}"
    platform: linux/amd64
    pull_policy: never
    restart: "no"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 2
    mem_limit: 2g
    environment:
      CLUSTER_ID: "${CDC_STAGE3_CLUSTER_ID:?set a dedicated Stage 3 KRaft UUID}"
      KAFKA_NODE_ID: '31'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: BROKER://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: BROKER://stage3-broker:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: BROKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 31@stage3-broker:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_DELETE_TOPIC_ENABLE: 'false'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
      KAFKA_HEAP_OPTS: -Xms512m -Xmx1024m
    volumes:
      - broker_log:/var/lib/kafka/data
      - broker_secrets:/etc/kafka/secrets
      - broker_config:/mnt/shared/config
    networks: [broker]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  stage3-connect:
    profiles: [stage3]
    image: "${CDC_STAGE3_CONNECT_IMAGE:?select the verified Stage 3 Connect image}"
    platform: linux/amd64
    pull_policy: never
    restart: "no"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 2
    mem_limit: 2g
    depends_on: [stage3-broker]
    environment:
      BOOTSTRAP_SERVERS: stage3-broker:9092
      GROUP_ID: foundation-r-stage3-connect
      CONFIG_STORAGE_TOPIC: foundation-r-stage3-connect-config
      OFFSET_STORAGE_TOPIC: foundation-r-stage3-connect-offset
      STATUS_STORAGE_TOPIC: foundation-r-stage3-connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: '1'
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: '1'
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: '1'
      CONNECT_OFFSET_STORAGE_PARTITIONS: '1'
      CONNECT_STATUS_STORAGE_PARTITIONS: '1'
      CONNECT_LISTENERS: http://127.0.0.1:8083
      ADVERTISED_HOST_NAME: localhost
      CONNECT_CONFIG_PROVIDERS: file
      CONNECT_CONFIG_PROVIDERS_FILE_CLASS: org.apache.kafka.common.config.provider.FileConfigProvider
      CONNECT_CONFIG_PROVIDERS_FILE_PARAM_ALLOWED_PATHS: /run/stage3
      CONNECT_TOPIC_CREATION_ENABLE: 'false'
      KAFKA_HEAP_OPTS: -Xms512m -Xmx1024m
    volumes:
      - connect_data:/kafka/data
      - connect_logs:/kafka/logs
      - connect_config:/kafka/config
      - type: bind
        source: "${CDC_STAGE3_SQL_PROPERTIES_FILE:?set the private Stage 3 SQL properties file}"
        target: /run/stage3/sql.properties
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${CDC_STAGE3_TRUSTSTORE_FILE:?set the Stage 3 SQL truststore}"
        target: /run/stage3/sql-truststore.p12
        read_only: true
        bind:
          create_host_path: false
    networks: [broker, sql_egress]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
volumes:
  broker_log:
  broker_secrets:
  broker_config:
  connect_data:
  connect_logs:
  connect_config:
networks:
  broker:
    internal: true
  sql_egress: {}
